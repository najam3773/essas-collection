services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ecom-backend/db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./ecom-backend/db/init/03_commerce_extras.sql:/docker-entrypoint-initdb.d/03_commerce_extras.sql:ro
      - ./ecom-backend/db/init/04_advanced_commerce.sql:/docker-entrypoint-initdb.d/04_advanced_commerce.sql:ro
      - ./ecom-backend/db/init/05_paid_commerce.sql:/docker-entrypoint-initdb.d/05_paid_commerce.sql:ro
      - ./ecom-backend/db/init/06_schema_drift_fixes.sql:/docker-entrypoint-initdb.d/06_schema_drift_fixes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local-only. Production uses Neon, not this Postgres service.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      API_PORT: 4000
      API_HOST: 127.0.0.1
      PORT: 3000
      WEB_URL: http://localhost:3000
      INTERNAL_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: /api
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      NODE_ENV: production
      IMAGE_STORAGE: local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/ecom-backend/uploads

volumes:
  postgres_data:
  api_uploads:
