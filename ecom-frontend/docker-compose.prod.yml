# Production frontend. Build with the real API URL, since NEXT_PUBLIC_* is
# inlined at build time:
#   NEXT_PUBLIC_API_URL=https://api.dreamfitters.com docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL, e.g. https://api.dreamfitters.com}
    image: ecom-frontend:latest
    restart: unless-stopped
    ports:
      # Bind to loopback only; terminate TLS in a reverse proxy in front of this.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
