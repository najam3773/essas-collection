# Essa's Collection — one public web service (Next.js + Express, same-origin /api).
# Secrets are not stored here. Set DATABASE_URL / DIRECT_URL / JWT_* on Render.
services:
  - type: web
    name: essas-collection
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: API_HOST
        value: "127.0.0.1"
      - key: NEXT_PUBLIC_API_URL
        value: "/api"
      - key: INTERNAL_API_URL
        value: "http://127.0.0.1:4000"
      - key: IMAGE_STORAGE
        value: local
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_STAFF_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false
