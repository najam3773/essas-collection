services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/03_commerce_extras.sql:/docker-entrypoint-initdb.d/03_commerce_extras.sql:ro
      - ./db/init/04_advanced_commerce.sql:/docker-entrypoint-initdb.d/04_advanced_commerce.sql:ro
      - ./db/init/05_paid_commerce.sql:/docker-entrypoint-initdb.d/05_paid_commerce.sql:ro
      - ./db/init/06_schema_drift_fixes.sql:/docker-entrypoint-initdb.d/06_schema_drift_fixes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
